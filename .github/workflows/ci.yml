name: CI

# Nothing gated lint / typecheck / tests before this workflow existed -- every
# check was run by hand on one machine. That is also why three assertions in
# auto-upgrade.test.ts sat green-on-Windows-only for a while: the fixture used a
# POSIX path literal while the code under test matches on `${sep}node_modules${sep}`,
# so the expectation only held where sep is "\". The ubuntu leg below is the
# point -- it runs the ~23 POSIX-only tests that `skipIf` skips on Windows, and
# it is the first time they have executed anywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick follow-up commit should cancel the superseded run
# rather than queue behind it. Never cancel on main: those runs are the record
# of what the default branch actually passed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing leg, not just the first -- a Windows-only or
      # Linux-only failure is exactly the class of bug this workflow exists
      # to catch, and fail-fast would mask the second one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` not `npm install`: install from the lockfile so a leg cannot
      # silently resolve a different tree than the one committed.
      - run: npm ci

      # Lint before typecheck before tests, cheapest gate first. `lint` is
      # read-only (`biome check`); the writing form is `lint:fix` and CI must
      # never use it -- a formatter that fixes in CI hides the diff from the
      # commit that should carry it.
      - name: Lint
        run: npm run lint

      # vitest does not typecheck, so a type error passes `npm test` and only
      # surfaces at build time. This step is not redundant with either.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the published artifact actually compiles. `files` in
      # package.json ships dist/ only, so a build break is a broken release
      # even when every test passes.
      - name: Build
        run: npm run build
