# Test-only CI.
#
# This repo releases through ./release.sh from a single workstation -- that is
# deliberate and unchanged; there is no publish job here and this workflow must
# never grow one.
#
# It exists for one reason: a meaningful set of assertions in this suite are
# guarded by `it.skipIf(process.platform === "win32")` because they depend on
# real POSIX semantics (owner-only 0600 on the trust store and the secret vault,
# 0700 on ~/.yaw-mcp/, atomic-write mode preservation, and the EACCES / ELOOP /
# ENOTDIR fallthrough in local-bundles). The only machine that runs the suite is
# Windows, so before this workflow those tests executed on no machine at all --
# they reported green while asserting nothing, which is the failure mode the
# suite is supposed to prevent.
#
# Most of those assertions have since been rewritten to test the decision rather
# than the filesystem, so they now run everywhere. One is irreducibly POSIX and
# still needs a POSIX runner to execute at all.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
